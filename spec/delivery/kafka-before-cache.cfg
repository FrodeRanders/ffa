SPECIFICATION SafetySpec
CONSTANTS
    Processes = {p1}
    Workers = {w1}
    MaxDeliveries = 1
    Mode = "STRIKT"
    None = none
    BrokenLocalCommit = TRUE
    BrokenForwarding = FALSE
    BrokenGraphGuard = FALSE
    BrokenObservation = FALSE
    BrokenLock = FALSE
INVARIANTS
    TypeOK
    DeliveryIdentity
    PublishedMeansAccepted
    KafkaHasLocalCopy
    NoConcurrentProcessWorkers
    ResilientFirstAcceptanceOrdered
    NoCacheRegression

    RawEvidenceSound
    GraphEvidenceSound
    GraphNeverRegresses
    StrictReadHasEvidence
