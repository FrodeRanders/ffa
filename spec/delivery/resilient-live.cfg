SPECIFICATION LiveSpec
CONSTANTS
    Processes = {p1}
    Workers = {w1, w2}
    MaxDeliveries = 2
    Mode = "LOKAL_RESILIENS"
    None = none
    BrokenLocalCommit = FALSE
    BrokenForwarding = FALSE
    BrokenGraphGuard = FALSE
    BrokenObservation = FALSE
    BrokenLock = FALSE
INVARIANTS
    TypeOK
    DeliveryIdentity
    PublishedMeansAccepted
    KafkaHasLocalCopy
    NoConcurrentProcessWorkers
    ResilientFirstAcceptanceOrdered
    NoCacheRegression
    OffsetHasForwarded
    RawEvidenceSound
    GraphEvidenceSound
    GraphNeverRegresses
    StrictReadHasEvidence
PROPERTIES
    EventuallyDelivered
    EventuallyInBackend

    EventuallyInGraph
    EventuallyObserved
