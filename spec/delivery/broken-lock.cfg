SPECIFICATION SafetySpec
CONSTANTS
    Processes = {p1}
    Workers = {w1, w2}
    MaxDeliveries = 2
    Mode = "LOKAL_RESILIENS"
    None = none
    BrokenLocalCommit = FALSE
    BrokenForwarding = FALSE
    BrokenGraphGuard = FALSE
    BrokenObservation = FALSE
    BrokenLock = TRUE
INVARIANTS
    TypeOK
    DeliveryIdentity
    PublishedMeansAccepted
    KafkaHasLocalCopy
    NoConcurrentProcessWorkers
    ResilientFirstAcceptanceOrdered
    NoCacheRegression
