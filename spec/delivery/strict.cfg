SPECIFICATION SafetySpec
CONSTANTS
    Processes = {p1, p2}
    Workers = {w1, w2}
    MaxDeliveries = 1
    Mode = "STRIKT"
    None = none
    BrokenLocalCommit = FALSE
    BrokenForwarding = FALSE
    BrokenGraphGuard = FALSE
    BrokenObservation = FALSE
    BrokenLock = FALSE
INVARIANTS
    TypeOK
    DeliveryIdentity
    PublishedMeansAccepted
    KafkaHasLocalCopy
    NoConcurrentProcessWorkers
    ResilientFirstAcceptanceOrdered
    NoCacheRegression

    OffsetHasForwarded
    RawEvidenceSound
    GraphEvidenceSound
    GraphNeverRegresses
    StrictReadHasEvidence
