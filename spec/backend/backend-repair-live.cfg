SPECIFICATION LiveSpec
CONSTANTS
    Processes = {p1}
    Workers = {w1, w2}
    IndexWorkers = {w1}
    MaxDeliveries = 2
    Copies = 1
    Conflicts = FALSE
    Foreign = foreign
    None = none
    WriteOrder = "OBJECT_FIRST"
    Confirmation = "OBJECT_SUFFICIENT"
    ReadPolicy = "VERSION"
    BrokenIndexProof = FALSE
    BrokenRepair = FALSE
    BrokenOverwrite = FALSE
INVARIANTS
    TypeOK
    IdentityImmutable
    StoresAgree
    ConfirmedHasObject
    ConfirmedHasIndexOrRepair
    ReturnedHasObject
    ReadDoesNotRegress
PROPERTIES
    EventuallySettled
    EventuallyDiscoverable
