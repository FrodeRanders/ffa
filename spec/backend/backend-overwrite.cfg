SPECIFICATION SafetySpec
CONSTANTS
    Processes = {p1}
    Workers = {w1, w2}
    IndexWorkers = {w1}
    MaxDeliveries = 1
    Copies = 1
    Conflicts = TRUE
    Foreign = foreign
    None = none
    WriteOrder = "INDEX_FIRST"
    Confirmation = "BOTH_REQUIRED"
    ReadPolicy = "VERSION"
    BrokenIndexProof = FALSE
    BrokenRepair = FALSE
    BrokenOverwrite = TRUE
INVARIANTS
    TypeOK
    IdentityImmutable
    StoresAgree
    ConfirmedHasObject
    ConfirmedHasIndexOrRepair
    ReturnedHasObject
    ReadDoesNotRegress
